services:
  db:
    image: postgres:17-alpine
    container_name: phoneme-activity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoneme_user
      POSTGRES_PASSWORD: phoneme_password
      POSTGRES_DB: phoneme_activity
    ports:
      - "55432:5432"
    volumes:
      - phoneme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoneme_user -d phoneme_activity"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoneme-activity-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://phoneme_user:phoneme_password@db:5432/phoneme_activity?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  phoneme_postgres_data:
